<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Portafolio de Juan Justiniani, protésico diseñador CAD/CAM dental.">
<title>Juan Justiniani · Protésico diseñador CAD/CAM dental</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#f4f7f9;--surface:#fff;--text:#0c1722;--muted:#586577;--line:#dbe3ea;--accent:#0f766e;--accent2:#14b8a6;--onacc:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1016;--surface:#111a23;--text:#eef3f7;--muted:#92a1b3;--line:#1f2d3b;--accent:#2dd4bf;--accent2:#0f766e;--onacc:#04201c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1016;--surface:#111a23;--text:#eef3f7;--muted:#92a1b3;--line:#1f2d3b;--accent:#2dd4bf;--accent2:#0f766e;--onacc:#04201c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 1.05rem/1.6 "Source Sans 3",system-ui,sans-serif;padding-bottom:5.5rem}
h1,h2,h3{font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;margin:0;line-height:1.05}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 1.25rem}
section{padding:3.2rem 0 .5rem;scroll-margin-top:1rem}
.eyebrow{margin:0 0 .6rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:.8rem;color:var(--accent)}
h2{font-size:clamp(2rem,7vw,3rem);font-weight:800;letter-spacing:-.02em;margin-bottom:1.4rem}
.hero{background:radial-gradient(60% 55% at 85% 0%,color-mix(in srgb,var(--accent) 38%,transparent),transparent),radial-gradient(55% 45% at 0% 100%,color-mix(in srgb,var(--accent2) 28%,transparent),transparent);padding:2.5rem 0 3rem}
.hero-in{display:grid;gap:1.6rem;align-items:center}
.ph{width:132px;height:132px;border-radius:50%;background:var(--surface) center/cover;border:4px solid var(--bg);box-shadow:0 0 0 3px var(--accent)}
.hero h1{font-size:clamp(2.5rem,10.5vw,5.4rem);font-weight:800;letter-spacing:-.04em}
.hero h1 span{display:block}
.role{font:600 1.35rem "Bricolage Grotesque",system-ui,sans-serif;color:var(--accent);margin:.9rem 0 1.1rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{padding:.3rem .8rem;border-radius:99px;background:color-mix(in srgb,var(--accent) 14%,transparent);font-size:.95rem}
.cta{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.5rem}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:.8rem 1.3rem;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;text-decoration:none;cursor:pointer;font-family:inherit;font-size:1rem}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--onacc)}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.about{font-size:clamp(1.08rem,3.8vw,1.4rem);line-height:1.55;max-width:52ch}
.rail{display:flex;gap:1rem;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -1.25rem;padding:0 1.25rem 1rem;-webkit-overflow-scrolling:touch}
.w{position:relative;flex:0 0 88%;max-width:560px;scroll-snap-align:center;aspect-ratio:16/9;border:0;border-radius:18px;overflow:hidden;padding:0;cursor:zoom-in;background:#111;text-align:left;color:#fff}
.w img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.w .cap{position:absolute;left:0;right:0;bottom:0;padding:2.6rem 1rem .9rem;background:linear-gradient(transparent,rgba(0,0,0,.82))}
.w h3{font-size:1.25rem;font-weight:700}
.w p{margin:.2rem 0 0;font-size:.92rem;opacity:.9;line-height:1.35}
.hint{color:var(--muted);font-size:.9rem;margin:.2rem 0 0}
.steps{display:grid;gap:1rem}
.step{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.3rem}
.step .n{display:inline-grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--accent);color:var(--onacc);font:800 1rem "Bricolage Grotesque",system-ui,sans-serif;margin-bottom:.8rem}
.step h3{font-size:1.3rem;margin-bottom:.8rem}
.list{display:grid;gap:.9rem}
.item{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:.9rem 1.1rem}
.item h3{font-size:1.1rem}
.item .m{color:var(--muted);font-size:.93rem;margin-top:.15rem}
.item p{margin:.4rem 0 0;font-size:.98rem}
.two{display:grid;gap:2.2rem}
.contact{display:grid;gap:.8rem;max-width:420px}
.contact .btn{padding:1rem 1.3rem;font-size:1.1rem}
footer{padding:2.5rem 0 1rem;color:var(--muted);font-size:.9rem;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:.6rem;padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bar .btn{flex:1}
#lb{width:min(1200px,96vw);padding:0;border:0;background:transparent}
#lb::backdrop{background:rgba(0,0,0,.85)}
#lb img{display:block;width:100%;height:auto;border-radius:12px}
.rv{opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
@media(min-width:900px){
 body{padding-bottom:0}.bar{display:none}
 .hero-in{grid-template-columns:1fr auto;gap:3rem}.hero-in .ph{order:2;width:260px;height:260px}
 .rail{display:grid;grid-template-columns:repeat(3,1fr);overflow:visible;margin:0;padding:0}.w{max-width:none}
 .steps{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr 1fr;gap:3rem}
}
</style>
</head>

var nw=D.name.split(" "),kk=Math.ceil(nw.length/2),names=nw.length>2?[nw.slice(0,kk).join(" "),nw.slice(kk).join(" ")]:nw;

function items(a){return '<div class="list">'+a.map(function(x){var m=[x.org,x.date].filter(Boolean).join(" · ");return '<div class="item"><h3>'+esc(x.role)+'</h3>'+(m?'<div class="m">'+esc(m)+'</div>':'')+(x.desc?'<p>'+esc(x.desc)+'</p>':'')+'</div>'}).join("")+'</div>'}
var h='<header class="hero"><div class="wrap hero-in"><div class="ph" role="img" aria-label="Foto de '+esc(D.name)+'" style="background-image:url('+D.photo+')"></div><div>'
+'<p class="eyebrow">Portafolio</p><h1>'+names.map(function(n){return '<span>'+esc(n)+'</span>'}).join("")+'</h1><p class="role">'+esc(D.title)+'</p>'+chips(tools)
+'<div class="cta"><a class="btn pri" href="#trabajos">Ver trabajos</a><a class="btn" href="#contacto">Contactar</a></div></div></div></header><main>';
h+='<section class="rv"><div class="wrap"><p class="eyebrow">Sobre mí</p><p class="about">'+esc(D.summary)+'</p></div></section>';
h+='<section id="trabajos" class="rv"><div class="wrap"><p class="eyebrow">Diseños en exocad</p><h2>Trabajos</h2><div class="rail">'
+D.works.map(function(w,i){return '<button class="w" data-i="'+i+'" aria-label="Ampliar: '+esc(w.title)+'"><img src="'+w.img+'" alt="'+esc(w.title)+'" loading="lazy"><span class="cap"><h3>'+esc(w.title)+'</h3><p>'+esc(w.desc)+'</p></span></button>'}).join("")
+'</div><p class="hint">Desliza para ver más · toca para ampliar</p></div></section>';
var main=D.skills.filter(function(g){return g.group!=="Personales"}),pers=D.skills.filter(function(g){return g.group==="Personales"})[0];
h+='<section class="rv"><div class="wrap"><p class="eyebrow">Del diseño a la pieza</p><h2>Flujo digital</h2><div class="steps">'
+main.map(function(g,i){return '<div class="step"><span class="n">'+(i+1)+'</span><h3>'+esc(g.group)+'</h3>'+chips(g.items)+'</div>'}).join("")+'</div>'
+(pers?'<h3 style="margin:2rem 0 .8rem;font-size:1.3rem">Cómo trabajo</h3>'+chips(pers.items):'')+'</div></section>';
h+='<section class="rv"><div class="wrap two"><div><p class="eyebrow">Estudios y cursos</p><h2>Formación</h2>'+items(D.edu)+'</div><div><p class="eyebrow">Prácticas</p><h2>Experiencia</h2>'+items(D.exp)+'</div></div></section>';
h+='<section id="contacto" class="rv"><div class="wrap"><p class="eyebrow">Contacto</p><h2>¿Hablamos?</h2><div class="contact"><a class="btn pri" href="'+wa+'" target="_blank" rel="noopener">Escribir por WhatsApp</a><a class="btn" href="mailto:'+esc(D.email)+'">'+esc(D.email)+'</a><a class="btn" href="tel:'+esc(D.phone.replace(/[^+\d]/g,""))+'">'+esc(D.phone)+'</a><a class="btn" href="'+esc(D.web)+'" target="_blank" rel="noopener">Instagram @jcaddesigner</a></div></div></section></main>';
h+='<footer>'+esc(D.name)+' · '+esc(D.title)+'</footer><div class="bar"><a class="btn pri" href="'+wa+'" target="_blank" rel="noopener">WhatsApp</a><a class="btn" href="mailto:'+esc(D.email)+'">Correo</a></div>';

if("IntersectionObserver" in window){var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.08});Array.prototype.forEach.call(rv,function(e){io.observe(e)})}else{Array.prototype.forEach.call(rv,function(e){e.classList.add("in")})}
